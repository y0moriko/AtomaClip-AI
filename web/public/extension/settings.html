<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      margin: 0;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #1a1a1a;
    }
    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    input:focus {
      outline: none;
      border-color: #6366f1;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background: #4f46e5;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .status.success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
    .status.info {
      background: #dbeafe;
      color: #1e40af;
      display: block;
    }
    .section {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }
    .section:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <h2>AtomaClip Settings</h2>
  
  <div class="section">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="your@email.com">
    
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Your password">
    
    <button id="loginBtn">Save & Login</button>
    <div id="status" class="status"></div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
