<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      margin: 0;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #1a1a1a;
    }
    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    input:focus {
      outline: none;
      border-color: #6366f1;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background: #4f46e5;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .status.success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }
  </style>
</head>
<body>
  <h2>AtomaClip Settings</h2>
  
  <label for="apiUrl">API Endpoint</label>
  <input type="text" id="apiUrl" placeholder="https://atomaclip.vercel.app">
  <p class="hint">Change this if using a local dev server</p>
  
  <button id="saveBtn">Save Settings</button>
  <div id="status" class="status"></div>

  <script src="settings.js"></script>
</body>
</html>
